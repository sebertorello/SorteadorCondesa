<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Sorteador — Condesa">
  <meta property="og:description" content="Gran sorteo — gracias por participar">
  <title>Sorteador — Condesa</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f1f1f1;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .contenedor {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ══════════════════════════════════════════
       VISTA A — Admin
    ══════════════════════════════════════════ */

    #vista-admin {
      min-height: 100vh;
      justify-content: center;
      padding: 48px 20px;
    }

    .admin-card {
      width: 100%;
      background: #fff;
      border: 1px solid #ddd;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .admin-titulo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .admin-estado {
      font-size: 13px;
      font-weight: 400;
      color: #666;
      background: #f5f5f5;
      border-left: 3px solid #ddd;
      padding: 11px 14px;
      line-height: 1.5;
    }

    .admin-estado strong { color: #333; font-weight: 600; }

    .campo label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 8px;
    }

    .campo input[type="text"],
    .campo input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      color: #333;
      border: 1px solid #ddd;
      outline: none;
      transition: border-color 0.2s;
    }

    .campo input[type="text"]:focus,
    .campo input[type="number"]:focus { border-color: #333; }
    .campo input[type="text"]::placeholder,
    .campo input[type="number"]::placeholder { color: #ccc; }

    /* Aviso de un solo uso */
    .admin-aviso {
      font-size: 11px;
      font-weight: 300;
      color: #999;
      line-height: 1.65;
      letter-spacing: 0.02em;
    }

    /* Feedback tras guardar */
    .admin-feedback {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      min-height: 18px; /* reservar espacio para evitar layout shift */
    }

    .admin-feedback.ok   { color: #2a7a4e; }
    .admin-feedback.vacio { color: #999; }

    /* Botones del admin */
    .admin-botones {
      display: flex;
      gap: 10px;
    }

    .btn-guardar-admin {
      flex: 1;
      padding: 13px;
      background: transparent;
      border: 1px solid #ccc;
      color: #555;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-guardar-admin:hover { border-color: #888; color: #333; }

    .btn-continuar {
      flex: 1;
      padding: 13px;
      background: #333;
      color: #f1f1f1;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-continuar:hover { background: #111; }

    .admin-nota {
      font-size: 11px;
      font-weight: 300;
      color: #bbb;
      letter-spacing: 0.04em;
    }

    /* ══════════════════════════════════════════
       VISTA B — Sorteador
    ══════════════════════════════════════════ */

    #vista-sorteador {
      padding: 48px 20px 60px;
      gap: 24px;
    }

    .logo {
      max-width: 260px;
      width: 100%;
      display: block;
    }

    @media (max-width: 480px) {
      .logo { max-width: 180px; }
    }

    .tagline {
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: #666;
      text-align: center;
      text-transform: uppercase;
    }

    #pantalla-inicial {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      padding: 16px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: #333;
      background: #fff;
      border: 1px solid #ddd;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.7;
    }

    textarea:focus { border-color: #333; }
    textarea::placeholder { color: #bbb; }

    .btn-sortear {
      width: 100%;
      padding: 16px;
      background: #333;
      color: #f1f1f1;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-sortear:hover { background: #111; }

    .btn-grabar {
      background: transparent;
      border: 1px solid #ccc;
      color: #666;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      padding: 10px 22px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-grabar:hover { border-color: #888; color: #333; }
    .btn-grabar.grabando { color: #c00; border-color: #c00; }

    /* Acordeón "Cómo grabar" — admin */
    .acordeon-btn {
      background: none;
      border: none;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #888;
      cursor: pointer;
      letter-spacing: 0.03em;
      text-align: left;
      width: 100%;
      transition: color 0.2s;
    }

    .acordeon-btn:hover { color: #333; }

    .acordeon-contenido {
      margin-top: 12px;
      background: #f8f8f8;
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 14px;
    }

    .tutorial-titulo {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
    }

    .tutorial-subtitulo {
      font-size: 11px;
      font-weight: 600;
      color: #333;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .tutorial-subtitulo-sep {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #eee;
    }

    .tutorial-paso {
      font-size: 12px;
      font-weight: 300;
      color: #555;
      line-height: 1.8;
      margin-bottom: 2px;
    }

    .tutorial-paso strong {
      font-weight: 600;
      color: #333;
    }

    /* ── Panel ruleta ─────────────────────────────── */

    #panel-ruleta {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      background: #333;
      padding: 40px 0 44px;
    }

    .ruleta-label {
      color: #888;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    /* Ventana visible: 3 ítems × 60px = 180px */
    .ruleta-ventana {
      position: relative;
      width: 100%;
      height: 180px;
      overflow: hidden;
    }

    /* Líneas separadoras del ítem central */
    .ruleta-linea-top,
    .ruleta-linea-bottom {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: #555;
      z-index: 2;
      pointer-events: none;
    }

    .ruleta-linea-top    { top: 60px; }
    .ruleta-linea-bottom { top: 120px; }

    /* Track desplazable con todos los nombres */
    .ruleta-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      will-change: transform; /* capa compuesta para GPU */
    }

    /* Cada ítem del carrusel */
    .ruleta-item {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 400;
      color: #f1f1f1;
      opacity: 0.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 20px;
      width: 100%;
    }

    /* Ítem central activo */
    .ruleta-item.activo {
      font-size: 26px;
      font-weight: 800;
      opacity: 1;
    }

    /* ── Panel ganador ────────────────────────────── */

    #panel-ganador {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      background: #333;
      padding: 52px 24px 48px;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #panel-ganador.visible {
      opacity: 1;
      transform: scale(1);
    }

    .ganador-etiqueta {
      font-size: 10px;
      font-weight: 500;
      color: #aaa;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .ganador-nombre {
      font-size: 32px;
      font-weight: 800;
      color: #f1f1f1;
      text-align: center;
      word-break: break-word;
      line-height: 1.2;
    }

    .ganador-nombre--multi {
      font-size: 22px;
      font-weight: 800;
      color: #f1f1f1;
      text-align: center;
      word-break: break-word;
      padding: 14px 0;
      width: 100%;
    }

    .ganadores-sep {
      width: 100%;
      height: 1px;
      background: #444;
    }

    .ganador-mensaje {
      font-size: 13px;
      font-weight: 300;
      color: #888;
      text-align: center;
      line-height: 1.6;
      margin-top: 20px;
    }

    /* Lista acumulativa de ganadores (mientras sortea) */
    #lista-acumulativa {
      width: 100%;
      background: #f1f1f1;
      padding: 16px 24px;
    }

    .lista-item {
      font-size: 18px;
      font-weight: 700;
      color: #333;
      padding: 10px 0;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .lista-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .lista-item + .lista-item {
      border-top: 1px solid #ddd;
    }

    #btn-volver {
      display: none;
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid #333;
      color: #333;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.2s;
    }

    #btn-volver:hover { background: #e6e6e6; }

    /* Canvas confeti */
    #canvas-confeti {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
      display: none;
    }
  </style>
</head>
<body>

  <canvas id="canvas-confeti"></canvas>

  <!-- ══ VISTA A: Admin ════════════════════════════════════════════ -->
  <div id="vista-admin" class="contenedor">
    <div class="admin-card">

      <p class="admin-titulo">Configuración de sorteo</p>

      <div class="admin-estado" id="admin-estado"></div>

      <div class="campo">
        <label for="input-cantidad">Cantidad de ganadores</label>
        <input
          type="number"
          id="input-cantidad"
          min="1"
          max="30"
          placeholder="1 (por defecto)"
          autocomplete="off"
        >
      </div>

      <div id="contenedor-ganadores" style="display:flex;flex-direction:column;gap:10px;"></div>

      <p class="admin-aviso">
        Podés fijar hasta 30 ganadores. Los nombres predefinidos salen siempre; el resto se elige al azar.
      </p>

      <div class="admin-feedback" id="admin-feedback"></div>

      <div class="admin-botones">
        <button class="btn-guardar-admin" id="btn-guardar-admin">Guardar</button>
        <button class="btn-continuar"     id="btn-continuar">Continuar →</button>
      </div>

      <div class="acordeon">
        <button class="acordeon-btn" id="btn-acordeon">▸ ¿Cómo grabar el sorteo?</button>
        <div id="acordeon-contenido" style="display:none;"></div>
      </div>

      <p class="admin-nota">Esta pantalla no se graba ni se comparte.</p>

    </div>
  </div>

  <!-- ══ VISTA B: Sorteador ════════════════════════════════════════ -->
  <div id="vista-sorteador" class="contenedor" style="display:none;">

    <img src="logosorteador.svg" alt="Condesa" class="logo">
    <p class="tagline">Gran sorteo — gracias por participar</p>

    <!-- Pantalla inicial: textarea + botones -->
    <div id="pantalla-inicial">
      <textarea id="textarea-participantes" placeholder="Pegá los nombres aquí, uno por línea..."></textarea>
      <button class="btn-sortear" id="btn-sortear">SORTEAR</button>
      <button class="btn-grabar"  id="btn-grabar">● Grabar pantalla</button>
    </div>

    <!-- Panel ruleta: track desplazable -->
    <div id="panel-ruleta">
      <div class="ruleta-label" id="ruleta-label">Sorteando...</div>
      <div class="ruleta-ventana">
        <div class="ruleta-linea-top"></div>
        <div class="ruleta-linea-bottom"></div>
        <div class="ruleta-track" id="ruleta-track"></div>
      </div>
    </div>

    <!-- Lista acumulativa de ganadores revelados -->
    <div id="lista-acumulativa" style="display:none;">
      <div id="lista-items"></div>
    </div>

    <!-- Panel ganador -->
    <div id="panel-ganador">
      <div class="ganador-etiqueta" id="ganador-etiqueta"></div>
      <div id="ganador-cuerpo"></div>
      <div class="ganador-mensaje" id="ganador-mensaje"></div>
    </div>

    <button id="btn-volver">Volver a sortear</button>

  </div>

  <script>
    // ─── Referencias ───────────────────────────────────────────────
    const vistaAdmin          = document.getElementById('vista-admin');
    const vistaSorteador      = document.getElementById('vista-sorteador');
    const btnGuardarAdmin     = document.getElementById('btn-guardar-admin');
    const btnContinuar        = document.getElementById('btn-continuar');
    const elAdminEstado       = document.getElementById('admin-estado');
    const elAdminFeedback     = document.getElementById('admin-feedback');
    const btnSortear          = document.getElementById('btn-sortear');
    const btnGrabar           = document.getElementById('btn-grabar');
    const btnVolver           = document.getElementById('btn-volver');
    const textarea            = document.getElementById('textarea-participantes');
    const pantallaInicial     = document.getElementById('pantalla-inicial');
    const panelRuleta         = document.getElementById('panel-ruleta');
    const panelGanador        = document.getElementById('panel-ganador');
    const ganadorEtiqueta     = document.getElementById('ganador-etiqueta');
    const ganadorCuerpo       = document.getElementById('ganador-cuerpo');
    const ganadorMensaje      = document.getElementById('ganador-mensaje');
    const ruletaLabel         = document.getElementById('ruleta-label');
    const inputCantidad       = document.getElementById('input-cantidad');
    const contenedorGanadores = document.getElementById('contenedor-ganadores');
    const listaAcumulativa    = document.getElementById('lista-acumulativa');
    const listaItems          = document.getElementById('lista-items');
    const canvas              = document.getElementById('canvas-confeti');
    const ctx                 = canvas.getContext('2d');
    const acordeonBtn         = document.getElementById('btn-acordeon');
    const acordeonContenido   = document.getElementById('acordeon-contenido');

    // ─── Estado de grabación ───────────────────────────────────────
    let mediaRecorder   = null;
    let grabando        = false;
    let chunksGrabacion = [];
    let rafConfeti      = null;

    // ══════════════════════════════════════════════════════════════
    // VISTA A — Admin
    // ══════════════════════════════════════════════════════════════

    function actualizarEstadoAdmin() {
      const cantidad     = localStorage.getItem('condesa_cantidad');
      const ganadoresRaw = localStorage.getItem('condesa_ganadores');
      const partes       = [];
      if (cantidad && parseInt(cantidad) > 1) partes.push(`Cantidad: <strong>${cantidad}</strong>`);
      if (ganadoresRaw) {
        try {
          const arr   = JSON.parse(ganadoresRaw);
          const fijos = arr.filter(g => g !== '');
          if (fijos.length > 0) partes.push(`Fijos: <strong>${fijos.join(', ')}</strong>`);
        } catch {}
      }
      elAdminEstado.innerHTML = partes.length
        ? partes.join(' · ')
        : 'Sorteo al azar (sin configuración guardada)';
    }

    actualizarEstadoAdmin();

    // Generar inputs de ganadores predefinidos dinámicamente
    function generarInputsGanadores(n, values) {
      const prevValues = values || Array.from(
        contenedorGanadores.querySelectorAll('input[type="text"]')
      ).map(inp => inp.value);
      contenedorGanadores.innerHTML = '';
      for (let i = 0; i < n; i++) {
        const campo = document.createElement('div');
        campo.className = 'campo';
        const label = document.createElement('label');
        label.textContent = `Ganador ${i + 1} (opcional)`;
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Nombre exacto (dejar vacío para sorteo al azar)';
        input.autocomplete = 'off';
        if (prevValues[i] !== undefined) input.value = prevValues[i];
        campo.appendChild(label);
        campo.appendChild(input);
        contenedorGanadores.appendChild(campo);
      }
    }

    // Inicializar inputs con valores guardados
    const _initCantidad  = parseInt(localStorage.getItem('condesa_cantidad')) || 1;
    inputCantidad.value  = _initCantidad > 1 ? _initCantidad : '';
    const _initGanadores = (() => {
      try { return JSON.parse(localStorage.getItem('condesa_ganadores')) || []; } catch { return []; }
    })();
    generarInputsGanadores(_initCantidad, _initGanadores);

    inputCantidad.addEventListener('input', () => {
      const n = Math.max(1, Math.min(30, parseInt(inputCantidad.value) || 1));
      generarInputsGanadores(n);
    });

    // Guardar: persiste configuración y muestra confirmación. No navega.
    btnGuardarAdmin.addEventListener('click', () => {
      const cantidadRaw  = parseInt(inputCantidad.value);
      const cantidad     = (!isNaN(cantidadRaw) && cantidadRaw >= 1)
        ? Math.min(30, cantidadRaw) : 1;
      const inputs       = contenedorGanadores.querySelectorAll('input[type="text"]');
      const ganadoresArr = Array.from(inputs).map(inp => inp.value.trim());

      localStorage.setItem('condesa_cantidad',  cantidad);
      localStorage.setItem('condesa_ganadores', JSON.stringify(ganadoresArr));
      localStorage.removeItem('condesa_winner');

      const fijos = ganadoresArr.filter(g => g !== '');
      let msg     = `✓ Guardado: ${cantidad} ganador${cantidad !== 1 ? 'es' : ''}`;
      if (fijos.length > 0) msg += ` · Fijos: ${fijos.join(', ')}`;
      elAdminFeedback.textContent = msg;
      elAdminFeedback.className   = 'admin-feedback ok';
      actualizarEstadoAdmin();
    });

    // Continuar: guarda configuración actual y navega a Vista B
    btnContinuar.addEventListener('click', () => {
      const cantidadRaw  = parseInt(inputCantidad.value);
      const cantidad     = (!isNaN(cantidadRaw) && cantidadRaw >= 1)
        ? Math.min(30, cantidadRaw) : 1;
      const inputs       = contenedorGanadores.querySelectorAll('input[type="text"]');
      const ganadoresArr = Array.from(inputs).map(inp => inp.value.trim());
      localStorage.setItem('condesa_cantidad',  cantidad);
      localStorage.setItem('condesa_ganadores', JSON.stringify(ganadoresArr));
      localStorage.removeItem('condesa_winner');
      vistaAdmin.style.display     = 'none';
      vistaSorteador.style.display = 'flex';
    });

    // ══════════════════════════════════════════════════════════════
    // Detección de dispositivo y templates de tutorial
    // ══════════════════════════════════════════════════════════════

    const esIOS     = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const esAndroid = /Android/.test(navigator.userAgent);

    const TUTORIAL_IOS = `
      <p class="tutorial-titulo">Cómo grabar el sorteo</p>
      <p class="tutorial-paso"><strong>1.</strong> Antes de sortear, activá la grabación nativa:<br>Abrí el Centro de Control (deslizá desde arriba a la derecha)</p>
      <p class="tutorial-paso"><strong>2.</strong> Tocá el ícono ⏺ de grabación de pantalla<br>(Si no lo ves, agregalo en Ajustes → Centro de Control)</p>
      <p class="tutorial-paso"><strong>3.</strong> Volvé al navegador y presioná SORTEAR</p>
      <p class="tutorial-paso"><strong>4.</strong> Cuando terminen los festejos, volvé al Centro de Control y detené la grabación<br>El video se guarda automáticamente en Fotos.</p>
    `;

    const TUTORIAL_ANDROID = `
      <p class="tutorial-titulo">Cómo grabar el sorteo</p>
      <p class="tutorial-paso"><strong>1.</strong> Antes de sortear, abrí el panel de notificaciones<br>(deslizá desde arriba)</p>
      <p class="tutorial-paso"><strong>2.</strong> Buscá el ícono "Grabador de pantalla" o "Screen Recorder"<br>(En Samsung: buscar en el panel rápido. En otros: puede estar en Ajustes → Funciones avanzadas)</p>
      <p class="tutorial-paso"><strong>3.</strong> Iniciá la grabación y volvé al navegador</p>
      <p class="tutorial-paso"><strong>4.</strong> Presioná SORTEAR</p>
      <p class="tutorial-paso"><strong>5.</strong> Cuando terminen los festejos, detené la grabación desde el panel de notificaciones</p>
    `;

    const TUTORIAL_AMBOS = `
      <p class="tutorial-titulo">Cómo grabar el sorteo</p>
      <p class="tutorial-subtitulo">iPhone / iPad</p>
      <p class="tutorial-paso"><strong>1.</strong> Antes de sortear, activá la grabación nativa:<br>Abrí el Centro de Control (deslizá desde arriba a la derecha)</p>
      <p class="tutorial-paso"><strong>2.</strong> Tocá el ícono ⏺ de grabación de pantalla<br>(Si no lo ves, agregalo en Ajustes → Centro de Control)</p>
      <p class="tutorial-paso"><strong>3.</strong> Volvé al navegador y presioná SORTEAR</p>
      <p class="tutorial-paso"><strong>4.</strong> Cuando terminen los festejos, volvé al Centro de Control y detené la grabación<br>El video se guarda automáticamente en Fotos.</p>
      <p class="tutorial-subtitulo tutorial-subtitulo-sep">Android</p>
      <p class="tutorial-paso"><strong>1.</strong> Antes de sortear, abrí el panel de notificaciones<br>(deslizá desde arriba)</p>
      <p class="tutorial-paso"><strong>2.</strong> Buscá el ícono "Grabador de pantalla" o "Screen Recorder"<br>(En Samsung: buscar en el panel rápido. En otros: puede estar en Ajustes → Funciones avanzadas)</p>
      <p class="tutorial-paso"><strong>3.</strong> Iniciá la grabación y volvé al navegador</p>
      <p class="tutorial-paso"><strong>4.</strong> Presioná SORTEAR</p>
      <p class="tutorial-paso"><strong>5.</strong> Cuando terminen los festejos, detené la grabación desde el panel de notificaciones</p>
    `;

    // ══════════════════════════════════════════════════════════════
    // VISTA A — Acordeón tutorial
    // ══════════════════════════════════════════════════════════════

    acordeonContenido.innerHTML = esIOS     ? TUTORIAL_IOS
                                : esAndroid ? TUTORIAL_ANDROID
                                : TUTORIAL_AMBOS;

    acordeonBtn.addEventListener('click', () => {
      const abierto = acordeonContenido.style.display !== 'none';
      acordeonContenido.style.display = abierto ? 'none' : 'block';
      acordeonBtn.textContent = (abierto ? '▸' : '▾') + ' ¿Cómo grabar el sorteo?';
    });

    // ══════════════════════════════════════════════════════════════
    // VISTA B — Grabación de pantalla
    // ══════════════════════════════════════════════════════════════

    if (navigator.mediaDevices?.getDisplayMedia && !esIOS && !esAndroid) {
      btnGrabar.addEventListener('click', iniciarGrabacion);
    } else {
      btnGrabar.style.display = 'none';
    }

    async function iniciarGrabacion() {
      if (grabando) return;

      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        chunksGrabacion = [];
        mediaRecorder   = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunksGrabacion.push(e.data); };

        mediaRecorder.onstop = () => {
          const blob = new Blob(chunksGrabacion, { type: 'video/webm' });
          const url  = URL.createObjectURL(blob);
          const a    = document.createElement('a');
          a.href     = url;
          a.download = 'sorteo-condesa.webm';
          a.click();
          URL.revokeObjectURL(url);
          btnGrabar.textContent = '● Grabar pantalla';
          btnGrabar.classList.remove('grabando');
        };

        mediaRecorder.start();
        grabando              = true;
        btnGrabar.textContent = '● Grabando...';
        btnGrabar.classList.add('grabando');

        stream.getVideoTracks()[0].addEventListener('ended', () => {
          grabando              = false;
          btnGrabar.textContent = '● Grabar pantalla';
          btnGrabar.classList.remove('grabando');
        });
      } catch {
        // Usuario canceló el selector de pantalla
      }
    }

    function detenerGrabacion() {
      if (!grabando || !mediaRecorder) return;
      setTimeout(() => {
        mediaRecorder.stop();
        grabando = false;
      }, 6000); // 6s después del ganador para capturar el confeti
    }

    // ══════════════════════════════════════════════════════════════
    // VISTA B — Sorteo
    // ══════════════════════════════════════════════════════════════

    btnSortear.addEventListener('click', () => {
      const participantes = textarea.value
        .split('\n')
        .map(n => n.trim())
        .filter(n => n.length > 0);

      if (participantes.length === 0) {
        alert('Agregá al menos un participante.');
        return;
      }

      const cantidadRaw = parseInt(localStorage.getItem('condesa_cantidad'));
      const cantidad    = (!isNaN(cantidadRaw) && cantidadRaw >= 1)
        ? Math.min(30, cantidadRaw) : 1;

      let predefinidos = [];
      try { predefinidos = JSON.parse(localStorage.getItem('condesa_ganadores')) || []; } catch {}

      const pool           = [...participantes];
      const ganadoresFinal = [];

      for (let i = 0; i < cantidad && pool.length > 0; i++) {
        const preset = (predefinidos[i] || '').trim();
        if (preset) {
          const idx = pool.findIndex(p => p.trim().toLowerCase() === preset.toLowerCase());
          if (idx !== -1) { ganadoresFinal.push(pool[idx]); pool.splice(idx, 1); continue; }
        }
        const idx = Math.floor(Math.random() * pool.length);
        ganadoresFinal.push(pool[idx]);
        pool.splice(idx, 1);
      }

      console.log('DEBUG cantidad:', cantidad);
      console.log('DEBUG predefinidos:', predefinidos);
      console.log('DEBUG ganadoresFinal:', ganadoresFinal);

      pantallaInicial.style.display  = 'none';
      listaItems.innerHTML           = '';
      listaAcumulativa.style.display = 'none';

      sortearSiguiente(0, ganadoresFinal, participantes);
    });

    // ══════════════════════════════════════════════════════════════
    // ANIMACIÓN DE RULETA — offset continuo en píxeles + translateY
    // ══════════════════════════════════════════════════════════════
    //
    // Geometría:
    //   ITEM_H = 60px · ventana = 3 ítems = 180px · centro ventana = 90px
    //   trackY para ítem i centrado = 90 - (i*60 + 30) = 60 - i*60
    //   Equivalente: trackY = 60 - pos   donde pos = i*60 (px scrolleados)
    //
    // Velocidades:
    //   V_MAX = 1080 px/s (18px/frame × 60fps)
    //   Fase rápida (0–2.5s): pos = V_MAX × elapsed_s  (analítico, exacto)
    //   Fase lenta (2.5–4s):  pos = POS_SLOW + V_MAX × T_SLOW_S × ∫(1-t)² dt
    //                              = POS_SLOW + V_MAX × T_SLOW_S × (t − t² + t³/3)
    //
    // WINNER_IDX = 54:
    //   POS_SLOW = V_MAX × 2.5 = 2700 px
    //   remaining = 54×60 − 2700 = 540 px
    //   vMax_slow = 3 × 540 / 1.5 = 1080 = V_MAX  → transición sin salto ✓
    //   Al finalizar: pos = 2700 + 1080 × 1.5 × (1/3) = 2700 + 540 = 3240 = 54×60 ✓

    const ITEM_H = 60;
    const V_MAX  = 1080;

    // ── Sorteo secuencial: una ruleta por ganador ───────────────

    function sortearSiguiente(index, ganadoresFinal, participantes) {
      if (index >= ganadoresFinal.length) {
        mostrarPanelFinal(ganadoresFinal);
        return;
      }

      const ganador = ganadoresFinal[index];
      const total   = ganadoresFinal.length;

      panelGanador.style.display    = 'none';
      panelGanador.classList.remove('visible');
      panelRuleta.style.display     = 'flex';

      ruletaLabel.textContent = total === 1
        ? 'Sorteando...'
        : `Sorteando ganador ${index + 1} de ${total}...`;

      animarRuleta(participantes, ganador, total, () => {
        if (total > 1) {
          listaAcumulativa.style.display = 'block';
          const item       = document.createElement('div');
          item.className   = 'lista-item';
          item.textContent = `${index + 1}. ${ganador}`;
          listaItems.appendChild(item);
          requestAnimationFrame(() => {
            requestAnimationFrame(() => { item.classList.add('visible'); });
          });
        }

        setTimeout(() => {
          sortearSiguiente(index + 1, ganadoresFinal, participantes);
        }, total > 1 ? 1500 : 0);
      });
    }

    function animarRuleta(participantes, ganador, total, onFin) {
      // >5 ganadores: tiempos y WINNER_IDX a la mitad para mantener V_SLOW = V_MAX
      const rapido    = total > 5;
      const winnerIdx = rapido ? 27  : 54;
      const tFastS    = rapido ? 1.25 : 2.5;
      const tSlowS    = rapido ? 0.75 : 1.5;
      const targetPos = winnerIdx * ITEM_H;
      const posLenta  = V_MAX * tFastS;
      const vLenta    = 3 * (targetPos - posLenta) / tSlowS;

      const arr = [];
      for (let i = 0; i < winnerIdx; i++) {
        arr.push(participantes[Math.floor(Math.random() * participantes.length)]);
      }
      arr.push(ganador);
      for (let i = 0; i < 5; i++) {
        arr.push(participantes[Math.floor(Math.random() * participantes.length)]);
      }

      const track = document.getElementById('ruleta-track');
      track.innerHTML = '';
      for (const nombre of arr) {
        const div       = document.createElement('div');
        div.className   = 'ruleta-item';
        div.textContent = nombre;
        track.appendChild(div);
      }

      track.style.transform = 'translateY(60px)';
      track.children[0].classList.add('activo');
      let prevActiveIdx = 0;
      let startTs = null;

      function frame(ts) {
        if (!startTs) startTs = ts;
        const elapsed = (ts - startTs) / 1000;

        let pos;
        if (elapsed < tFastS) {
          pos = V_MAX * elapsed;
        } else if (elapsed < tFastS + tSlowS) {
          const t    = (elapsed - tFastS) / tSlowS;
          const intg = t - t * t + (t * t * t) / 3;
          pos = posLenta + vLenta * tSlowS * intg;
        } else {
          track.style.transform = `translateY(${60 - targetPos}px)`;
          if (track.children[prevActiveIdx]) track.children[prevActiveIdx].classList.remove('activo');
          if (track.children[winnerIdx])     track.children[winnerIdx].classList.add('activo');
          setTimeout(onFin, 350);
          return;
        }

        track.style.transform = `translateY(${60 - pos}px)`;

        const centerIdx = Math.round(pos / ITEM_H);
        if (centerIdx !== prevActiveIdx) {
          if (track.children[prevActiveIdx]) track.children[prevActiveIdx].classList.remove('activo');
          if (track.children[centerIdx])     track.children[centerIdx].classList.add('activo');
          prevActiveIdx = centerIdx;
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    }

    // ── Panel final: todos los ganadores + confeti ──────────────

    function mostrarPanelFinal(ganadores) {
      panelRuleta.style.display      = 'none';
      listaAcumulativa.style.display = 'none';

      localStorage.removeItem('condesa_ganadores');
      localStorage.removeItem('condesa_cantidad');

      const esMultiple = ganadores.length > 1;
      ganadorEtiqueta.textContent   = esMultiple ? '✦ Ganadores ✦' : '✦ Ganador ✦';
      ganadorEtiqueta.style.display = '';
      ganadorMensaje.textContent    = esMultiple
        ? '¡Felicitaciones a todos! Gracias por participar.'
        : '¡Felicitaciones! Gracias a todos por participar.';
      ganadorMensaje.style.display  = '';

      ganadorCuerpo.innerHTML = esMultiple
        ? ganadores.map((g, i) =>
            (i > 0 ? '<div class="ganadores-sep"></div>' : '') +
            `<div class="ganador-nombre ganador-nombre--multi">${g}</div>`
          ).join('')
        : `<div class="ganador-nombre">${ganadores[0]}</div>`;

      panelGanador.classList.remove('visible');
      panelGanador.style.display = 'flex';

      requestAnimationFrame(() => {
        requestAnimationFrame(() => { panelGanador.classList.add('visible'); });
      });

      iniciarConfeti();
      detenerGrabacion();

      setTimeout(() => { btnVolver.style.display = 'block'; }, 5200);
    }

    // ══════════════════════════════════════════════════════════════
    // Confeti
    // ══════════════════════════════════════════════════════════════

    const COLORES = ['#C9A84C', '#C9A84C', '#E8D5A3', '#E8D5A3', '#888888', '#333333', '#ffffff'];

    function iniciarConfeti() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.style.display = 'block';

      const particulas = [];
      for (let i = 0; i < 120; i++) {
        particulas.push({
          x:        Math.random() * canvas.width,
          y:        -10 - Math.random() * 120,
          vx:       (Math.random() - 0.5) * 2,
          vy:       1.8 + Math.random() * 2.8,
          color:    COLORES[Math.floor(Math.random() * COLORES.length)],
          forma:    Math.random() > 0.45 ? 'rect' : 'circ',
          angulo:   Math.random() * Math.PI * 2,
          velAng:   (Math.random() - 0.5) * 0.12,
          fase:     Math.random() * Math.PI * 2,
          amplitud: 0.6 + Math.random() * 1.6,
        });
      }

      let tsInicio = null;

      function dibujar(ts) {
        if (!tsInicio) tsInicio = ts;
        const elapsed = ts - tsInicio;

        if (elapsed > 5000) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.style.display = 'none';
          return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const p of particulas) {
          p.y      += p.vy;
          p.fase   += 0.045;
          p.x      += p.vx + Math.sin(p.fase) * p.amplitud;
          p.angulo += p.velAng;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angulo);
          ctx.fillStyle = p.color;

          if (p.forma === 'circ') {
            ctx.beginPath();
            ctx.arc(0, 0, 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillRect(-1, -4, 2, 8);
          }

          ctx.restore();
        }

        rafConfeti = requestAnimationFrame(dibujar);
      }

      rafConfeti = requestAnimationFrame(dibujar);
    }

    // ══════════════════════════════════════════════════════════════
    // Volver a sortear
    // ══════════════════════════════════════════════════════════════

    btnVolver.addEventListener('click', () => {
      if (rafConfeti) cancelAnimationFrame(rafConfeti);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.style.display = 'none';

      panelGanador.classList.remove('visible');
      panelGanador.style.display     = 'none';
      ganadorCuerpo.innerHTML        = '';
      btnVolver.style.display        = 'none';
      listaItems.innerHTML           = '';
      listaAcumulativa.style.display = 'none';

      textarea.value                = '';
      pantallaInicial.style.display = 'flex';
    });
  </script>
</body>
